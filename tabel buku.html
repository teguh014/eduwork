<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tabel Buku</title>
  <style>
    table {
      width: 60%;
      border-collapse: collapse;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: center;
    }
    th {
      background-color: #f4f4f4;
    }
    caption {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <table>
    <caption>Daftar Buku</caption>
    <tr>
      <th>Judul Buku</th>
      <th>Nomor Buku</th>
      <th>Harga</th>
    </tr>
    <tr>
      <td>Pemrograman Web Dasar</td>
      <td>001</td>
      <td>Rp75.000</td>
    </tr>
    <tr>
      <td>Belajar Database</td>
      <td>002</td>
      <td>Rp65.000</td>
    </tr>
    <tr>
      <td>Algoritma & Struktur Data</td>
      <td>003</td>
      <td>Rp80.000</td>
    </tr>
  </table>
</body>
</html>
